<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список врачей</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h2 {
            margin-bottom: 20px;
        }

        ul {
            list-style-type: disc;
            padding-left: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Выберите врача</h2>

<ul>
    <li th:each="doctor : ${doctors}">
        [[${doctor.name}]] — [[${doctor.specialization}]]
    </li>
</ul>

<a th:href="@{'/select-doctor'(patientId=${patientId})}">
    <button>Записаться</button>
</a>

</body>
</html>
