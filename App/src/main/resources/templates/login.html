<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input {
            padding: 8px;
            font-size: 16px;
            width: 250px;
        }

        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>Вход</h1>

<form action="/login" method="post">
    <label>Email:
        <input type="email" name="email">
    </label>
    <label>Пароль:
        <input type="password" name="password">
    </label>
    <button type="submit">Войти</button>
</form>

<p th:if="${error}" th:text="${error}" class="error"></p>

</body>
</html>
