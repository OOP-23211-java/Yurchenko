<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 8px;
            font-size: 16px;
            width: 250px;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Регистрация пациента</h1>

<form action="/register" method="post" th:object="${patient}">
    <label>Имя:
        <input type="text" th:field="*{name}" />
    </label>
    <label>Email:
        <input type="email" th:field="*{email}" />
    </label>
    <label>Пароль:
        <input type="password" th:field="*{password}" />
    </label>
    <button type="submit">Зарегистрироваться</button>
</form>

<p th:if="${error}" th:text="${error}" style="color:red;"></p>

</body>
</html>
